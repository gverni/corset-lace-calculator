<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 706" width="460" height="706" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title id="t">10 eyelets per side, loop between eyelets 8 and 9</title><desc id="d">Eyelet pass directions from the top: 1 In, 2 Out, 3 In, 4 Out, 5 In, 6 Out, 7 In, 8 Out, 9 In, 10 Out.</desc><rect width="460" height="706" rx="10" fill="#ffffff"/><text x="24" y="34" font-size="16" font-weight="600" fill="#111827">10 eyelets per side, loop between eyelets 8 and 9</text><text x="24" y="56" font-size="12" fill="#6b7280">Eyelet 1: In. Laced side seen from outside, as worn. Not to scale.</text><line x1="165" y1="120" x2="295" y2="164" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="295" y1="120" x2="165" y2="164" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="165" y1="208" x2="295" y2="252" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="295" y1="208" x2="165" y2="252" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="165" y1="296" x2="295" y2="340" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="295" y1="296" x2="165" y2="340" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="165" y1="384" x2="295" y2="428" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="295" y1="384" x2="165" y2="428" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="165" y1="472" x2="295" y2="516" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="295" y1="472" x2="165" y2="516" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="165" y1="120" x2="295" y2="120" stroke="#111827" stroke-width="2"/><line x1="165" y1="164" x2="295" y2="208" stroke="#111827" stroke-width="2"/><line x1="295" y1="164" x2="165" y2="208" stroke="#111827" stroke-width="2"/><line x1="165" y1="252" x2="295" y2="296" stroke="#111827" stroke-width="2"/><line x1="295" y1="252" x2="165" y2="296" stroke="#111827" stroke-width="2"/><line x1="165" y1="340" x2="295" y2="384" stroke="#111827" stroke-width="2"/><line x1="295" y1="340" x2="165" y2="384" stroke="#111827" stroke-width="2"/><line x1="165" y1="516" x2="165" y2="552" stroke="#111827" stroke-width="2"/><text x="165" y="568" font-size="11" text-anchor="middle" fill="#6b7280">end</text><line x1="295" y1="516" x2="295" y2="552" stroke="#111827" stroke-width="2"/><text x="295" y="568" font-size="11" text-anchor="middle" fill="#6b7280">end</text><path d="M 165 428 C 85 414, 85 486, 165 472" fill="none" stroke="#c2410c" stroke-width="3"/><text x="129" y="454" font-size="12" font-weight="600" text-anchor="middle" fill="#c2410c">loop</text><path d="M 295 428 C 375 414, 375 486, 295 472" fill="none" stroke="#c2410c" stroke-width="3"/><text x="331" y="454" font-size="12" font-weight="600" text-anchor="middle" fill="#c2410c">loop</text><text x="230" y="108" font-size="11" text-anchor="middle" fill="#6b7280">top bar</text><circle cx="165" cy="120" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><circle cx="295" cy="120" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="81" y="124" font-size="13" font-weight="400" text-anchor="end" fill="#0f766e">1  In</text><text x="379" y="124" font-size="13" font-weight="400" text-anchor="start" fill="#0f766e">1  In</text><circle cx="165" cy="164" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><circle cx="295" cy="164" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><text x="81" y="168" font-size="13" font-weight="400" text-anchor="end" fill="#6d28d9">2  Out</text><text x="379" y="168" font-size="13" font-weight="400" text-anchor="start" fill="#6d28d9">2  Out</text><circle cx="165" cy="208" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><circle cx="295" cy="208" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="81" y="212" font-size="13" font-weight="400" text-anchor="end" fill="#0f766e">3  In</text><text x="379" y="212" font-size="13" font-weight="400" text-anchor="start" fill="#0f766e">3  In</text><circle cx="165" cy="252" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><circle cx="295" cy="252" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><text x="81" y="256" font-size="13" font-weight="400" text-anchor="end" fill="#6d28d9">4  Out</text><text x="379" y="256" font-size="13" font-weight="400" text-anchor="start" fill="#6d28d9">4  Out</text><circle cx="165" cy="296" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><circle cx="295" cy="296" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="81" y="300" font-size="13" font-weight="400" text-anchor="end" fill="#0f766e">5  In</text><text x="379" y="300" font-size="13" font-weight="400" text-anchor="start" fill="#0f766e">5  In</text><circle cx="165" cy="340" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><circle cx="295" cy="340" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><text x="81" y="344" font-size="13" font-weight="400" text-anchor="end" fill="#6d28d9">6  Out</text><text x="379" y="344" font-size="13" font-weight="400" text-anchor="start" fill="#6d28d9">6  Out</text><circle cx="165" cy="384" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><circle cx="295" cy="384" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="81" y="388" font-size="13" font-weight="400" text-anchor="end" fill="#0f766e">7  In</text><text x="379" y="388" font-size="13" font-weight="400" text-anchor="start" fill="#0f766e">7  In</text><circle cx="165" cy="428" r="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/><circle cx="165" cy="428" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><circle cx="295" cy="428" r="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/><circle cx="295" cy="428" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><text x="81" y="432" font-size="13" font-weight="700" text-anchor="end" fill="#6d28d9">8  Out</text><text x="379" y="432" font-size="13" font-weight="700" text-anchor="start" fill="#6d28d9">8  Out</text><circle cx="165" cy="472" r="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/><circle cx="165" cy="472" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><circle cx="295" cy="472" r="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/><circle cx="295" cy="472" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="81" y="476" font-size="13" font-weight="700" text-anchor="end" fill="#0f766e">9  In</text><text x="379" y="476" font-size="13" font-weight="700" text-anchor="start" fill="#0f766e">9  In</text><circle cx="165" cy="516" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><circle cx="295" cy="516" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><text x="81" y="520" font-size="13" font-weight="400" text-anchor="end" fill="#6d28d9">10  Out</text><text x="379" y="520" font-size="13" font-weight="400" text-anchor="start" fill="#6d28d9">10  Out</text><line x1="24" y1="606" x2="64" y2="606" stroke="#111827" stroke-width="2"/><text x="74" y="610" font-size="12" fill="#111827">Lace on the outside (visible)</text><line x1="24" y1="628" x2="64" y2="628" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><text x="74" y="632" font-size="12" fill="#111827">Lace on the inside (hidden)</text><text x="24" y="656" font-size="12" fill="#111827"><tspan fill="#0f766e" font-weight="600">In</tspan> = lace goes from outside to inside.  <tspan fill="#6d28d9" font-weight="600">Out</tspan> = from inside to outside.</text><text x="24" y="678" font-size="12" fill="#c2410c">The loop comes out of eyelet 8 and goes into eyelet 9, on each side.</text></svg>