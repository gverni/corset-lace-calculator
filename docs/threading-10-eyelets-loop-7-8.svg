-anchor="end" fill="#6d28d9">3  Out</text><text x="379" y="212" font-size="13" font-weight="400" text-anchor="start" fill="#6d28d9">3  Out</text><circle cx="165" cy="252" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><circle cx="295" cy="252" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="81" y="256" font-size="13" font-weight="400" text-anchor="end" fill="#0f766e">4  In</text><text x="379" y="256" font-size="13" font-weight="400" text-anchor="start" fill="#0f766e">4  In</text><circle cx="165" cy="296" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><circle cx="295" cy="296" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><text x="81" y="300" font-size="13" font-weight="400" text-anchor="end" fill="#6d28d9">5  Out</text><text x="379" y="300" font-size="13" font-weight="400" text-anchor="start" fill="#6d28d9">5  Out</text><circle cx="165" cy="340" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><circle cx="295" cy="340" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="81" y="344" font-size="13" font-weight="400" text-anchor="end" fill="#0f766e">6  In</text><text x="379" y="344" font-size="13" font-weight="400" text-anchor="start" fill="#0f766e">6  In</text><circle cx="165" cy="384" r="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/><circle cx="165" cy="384" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><circle cx="295" cy="384" r="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/><circle cx="295" cy="384" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><text x="81" y="388" font-size="13" font-weight="700" text-anchor="end" fill="#6d28d9">7  Out</text><text x="379" y="388" font-size="13" font-weight="700" text-anchor="start" fill="#6d28d9">7  Out</text><circle cx="165" cy="428" r="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/><circle cx="165" cy="428" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><circle cx="295" cy="428" r="12" fill="#ffedd5" stroke