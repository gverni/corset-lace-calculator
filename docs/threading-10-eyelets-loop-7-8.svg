<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 706" width="460" height="706" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title id="t">10 eyelets per side, loop between eyelets 7 and 8</title><desc id="d">Eyelet pass directions from the top: 1 Out, 2 In, 3 Out, 4 In, 5 Out, 6 In, 7 Out, 8 In, 9 Out, 10 In.</desc><rect width="460" height="706" rx="10" fill="#ffffff"/><text x="24" y="34" font-size="16" font-weight="600" fill="#111827">10 eyelets per side, loop between eyelets 7 and 8</text><text x="24" y="56" font-size="12" fill="#6b7280">Eyelet 1: Out. Laced side seen from outside, as worn. Not to scale.</text><line x1="165" y1="120" x2="295" y2="120" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="165" y1="164" x2="295" y2="208" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="295" y1="164" x2="165" y2="208" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="165" y1="252" x2="295" y2="296" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="295" y1="252" x2="165" y2="296" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="165" y1="340" x2="295" y2="384" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="295" y1="340" x2="165" y2="384" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="165" y1="428" x2="295" y2="472" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="295" y1="428" x2="165" y2="472" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/><line x1="165" y1="120" x2="295" y2="164" stroke="#111827" stroke-width="2"/><line x1="295" y1="120" x2="165" y2="164" stroke="#111827" stroke-width="2"/><line x1="165" y1="208" x2="295" y2="252" stroke="#111827" stroke-width="2"/><line x1="295" y1="208" x2="165" y2="252" stroke="#111827" stroke-width="2"/><line x1="165" y1="296" x2="295" y2="340" stroke="#111827" stroke-width="2"/><line x1="295" y1="296" x2="16